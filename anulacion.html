<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anulación de Facturas</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#0f172a",
                        "surface-dark": "#1e293b",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Manrope', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 antialiased font-display overflow-hidden">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside id="sidebar"
            class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col fixed inset-y-0 left-0 z-50 transition-transform duration-300">
        </aside>

        <!-- Main Content -->
        <div class="flex-1 ml-64 flex flex-col h-screen overflow-hidden bg-background-light dark:bg-background-dark">
            <!-- Header -->
            <header id="main-header"
                class="sticky top-0 z-40 flex h-16 items-center justify-between border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-background-dark/80 px-8 backdrop-blur-md">
                <div class="flex items-center gap-4">
                    <h2 class="text-xl font-bold tracking-tight">Facturación</h2>
                </div>
                <!-- User Placeholder for sidebar.js -->
                <div class="header-user-placeholder flex items-center gap-2"></div>
            </header>

            <main class="flex-1 overflow-auto p-8">
                <div class="max-w-[1400px] mx-auto space-y-6">

                    <!-- Title -->
                    <div class="flex flex-col sm:flex-row justify-between gap-4 items-center">
                        <div>
                            <h1 class="text-3xl font-bold">Anulación de Facturas</h1>
                            <p class="text-slate-500 dark:text-slate-400 mt-1">Busque facturas para cambiar su estado a
                                Anulada.</p>
                        </div>
                    </div>

                    <!-- Filters (Reusing logic from Reimpresion) -->
                    <div
                        class="bg-white dark:bg-surface-dark p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 flex flex-wrap gap-4 items-end">
                        <div class="w-32">
                            <label class="block text-xs font-bold text-slate-500 mb-1">Factura #</label>
                            <input type="number" id="filtro-id" placeholder="ID"
                                class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:ring-2 focus:ring-primary outline-none">
                        </div>
                        <div class="flex-1 min-w-[200px]">
                            <label class="block text-xs font-bold text-slate-500 mb-1">Buscar Cliente</label>
                            <div class="relative">
                                <span
                                    class="material-symbols-outlined absolute left-3 top-2.5 text-slate-400 text-lg">search</span>
                                <input type="text" id="filtro-cliente" placeholder="Nombre del cliente..."
                                    class="w-full pl-10 pr-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:ring-2 focus:ring-primary outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">Desde</label>
                            <input type="date" id="filtro-fecha-inicio"
                                class="px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:ring-2 focus:ring-primary outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">Hasta</label>
                            <input type="date" id="filtro-fecha-fin"
                                class="px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:ring-2 focus:ring-primary outline-none">
                        </div>
                        <button id="btn-filtrar"
                            class="bg-primary hover:bg-primary/90 text-slate-900 font-bold py-2 px-5 rounded-lg flex items-center gap-2 transition-colors">
                            <span class="material-symbols-outlined">search</span>
                            Buscar
                        </button>
                    </div>

                    <!-- Table -->
                    <div
                        class="bg-white dark:bg-surface-dark rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead
                                    class="bg-slate-50 dark:bg-slate-800/50 text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider text-xs">
                                    <tr>
                                        <th class="px-6 py-4">Factura #</th>
                                        <th class="px-6 py-4">Fecha</th>
                                        <th class="px-6 py-4">Cliente</th>
                                        <th class="px-6 py-4">Estado</th>
                                        <th class="px-6 py-4 text-right">Total</th>
                                        <th class="px-6 py-4 text-center">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-anulacion" class="divide-y divide-slate-100 dark:divide-slate-800">
                                    <!-- Populated by JS -->
                                </tbody>
                            </table>
                        </div>
                        <!-- Empty State -->
                        <div id="loading-indicator" class="p-8 text-center text-slate-500">
                            Cargando historial...
                        </div>
                        <div id="empty-state" class="hidden p-12 text-center text-slate-500">
                            <span class="material-symbols-outlined text-4xl mb-2 opacity-50">block</span>
                            <p>No se encontraron facturas con los criterios seleccionados.</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/sidebar.js"></script>
    <script src="js/main.js"></script>
    <script src="js/anulacion.js"></script>
</body>

</html>
