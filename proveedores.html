<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento de Proveedores</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide-react@0.390.0/dist/lucide-react.js"></script>
</head>

<body>
    <div id="app-container">
        <header id="main-header">
            <i data-lucide="home"></i>
            <div class="header-title">
                <span>sistema.com</span>
            </div>
            <div class="header-icons">
                <i data-lucide="user"></i>
                <i data-lucide="more-vertical"></i>
            </div>
        </header>

        <div id="main-layout">
            <aside id="sidebar">
                <div class="sidebar-header">
                    <h1>MENÚ</h1>
                </div>
                <nav class="sidebar-nav">
                    <div class="active-user"><i data-lucide="user" class="text-yellow"></i><span
                            class="text-yellow">Camilo B</span></div>
                </nav>
            </aside>

            <main id="main-content">
                <div class="container">
                    <div class="header-with-button">
                        <h1>Mantenimiento de Proveedores</h1>
                        <button id="btn-abrir-modal" class="btn-primary">Agregar Proveedor</button>
                    </div>

                    <!-- The Modal -->
                    <div id="proveedor-modal" class="modal">
                        <!-- Modal content -->
                        <div class="modal-content">
                            <div class="modal-header">
                                <h2 id="modal-title">Agregar Proveedor</h2>
                                <span class="close-button">&times;</span>
                            </div>
                            <div class="modal-body">
                                <form id="form-proveedor">
                                    <input type="hidden" id="id_proveedor">
                                    <div class="form-grid">
                                        <div class="form-group">
                                            <label for="nombre">Nombre</label>
                                            <input type="text" id="nombre" name="nombre" required>
                                        </div>
                                        <div class="form-group">
                                            <label for="contacto">Contacto</label>
                                            <input type="text" id="contacto" name="contacto">
                                        </div>
                                        <div class="form-group">
                                            <label for="cedula_juridica">Cédula Jurídica</label>
                                            <input type="text" id="cedula_juridica" name="cedula_juridica">
                                        </div>
                                        <div class="form-group">
                                            <label for="telefono">Teléfono</label>
                                            <input type="tel" id="telefono" name="telefono">
                                        </div>
                                        <div class="form-group">
                                            <label for="email">Email</label>
                                            <input type="email" id="email" name="email">
                                        </div>
                                        <div class="form-group">
                                            <label for="fecha_inicio_relacion">Fecha Inicio Relación</label>
                                            <input type="date" id="fecha_inicio_relacion" name="fecha_inicio_relacion">
                                        </div>
                                        <div class="form-group full-width">
                                            <label for="direccion">Dirección</label>
                                            <input type="text" id="direccion" name="direccion">
                                        </div>
                                    </div>
                                    <div class="button-container">
                                        <button type="submit" id="btn-guardar">Guardar</button>
                                        <button type="button" id="btn-limpiar">Limpiar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <h2>Listado de Proveedores</h2>
                    <table id="tabla-proveedores">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Contacto</th>
                                <th>Teléfono</th>
                                <th>Email</th>
                                <th class="acciones">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpo-tabla-proveedores">
                            <!-- Filas de proveedores se insertarán aquí -->
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/main.js"></script>
    <script src="js/proveedores.js"></script>
    <script>
        // La inicialización de lucide ahora se maneja dentro de main.js
        // para asegurar que los íconos dinámicos se rendericen correctamente.
    </script>
</body>

</html>
