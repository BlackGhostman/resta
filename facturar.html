<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturar - Sistema de Restaurante</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#0f172a",
                        "surface-dark": "#1e293b",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Manrope', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Preserve essential grid layout for POS if necessary, or rely on Tailwind */
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 antialiased font-display overflow-hidden">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside id="sidebar"
            class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col fixed inset-y-0 left-0 z-50 transition-transform duration-300">
        </aside>

        <!-- Main Content -->
        <div class="flex-1 ml-64 flex flex-col h-screen overflow-hidden bg-background-light dark:bg-background-dark">
            <!-- Header -->
            <header id="main-header"
                class="sticky top-0 z-40 flex h-16 items-center justify-between border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-background-dark/80 px-8 backdrop-blur-md">
                <div class="flex items-center gap-4">
                    <h2 class="text-xl font-bold tracking-tight">Facturación</h2>
                </div>
                <!-- User Placeholder for sidebar.js -->
                <div class="header-user-placeholder flex items-center gap-2"></div>
            </header>

            <main class="flex-1 overflow-auto p-8">
                <div class="max-w-[1600px] mx-auto space-y-6">

                    <!-- Factura Info Section -->
                    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                        <!-- Left Column: Order Details -->
                        <div class="lg:col-span-3 space-y-6">

                            <!-- Header Info -->
                            <div
                                class="bg-white dark:bg-surface-dark p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800">
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div>
                                        <label for="mesa-select" class="block text-sm font-bold mb-1">Mesa</label>
                                        <select id="mesa-select"
                                            class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-4 py-2.5 outline-none focus:ring-2 focus:ring-primary">
                                            <option value="">Seleccione una mesa...</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label for="nombre-cliente" class="block text-sm font-bold mb-1">Nombre del
                                            Cliente</label>
                                        <input type="text" id="nombre-cliente"
                                            class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-4 py-2.5 outline-none focus:ring-2 focus:ring-primary"
                                            placeholder="Nombre provisional">
                                    </div>
                                    <div>
                                        <label for="cantidad-personas"
                                            class="block text-sm font-bold mb-1">Personas</label>
                                        <input type="number" id="cantidad-personas"
                                            class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-4 py-2.5 outline-none focus:ring-2 focus:ring-primary"
                                            min="1" value="1">
                                    </div>
                                </div>
                            </div>

                            <!-- Search -->
                            <div class="relative">
                                <span
                                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">search</span>
                                <input type="text" id="buscar-articulo"
                                    class="w-full bg-white dark:bg-surface-dark border border-slate-200 dark:border-slate-700 rounded-xl py-3 pl-12 pr-4 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none text-lg"
                                    placeholder="Buscar artículo para agregar...">
                                <div id="resultados-busqueda"
                                    class="hidden absolute top-full left-0 right-0 mt-2 bg-white dark:bg-surface-dark border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl z-50 max-h-60 overflow-y-auto">
                                </div>
                            </div>

                            <!-- Items Table -->
                            <div
                                class="bg-white dark:bg-surface-dark rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden min-h-[300px]">
                                <table class="w-full text-left text-sm">
                                    <thead
                                        class="bg-slate-50 dark:bg-slate-800/50 text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider text-xs">
                                        <tr>
                                            <th class="px-6 py-4">Descripción</th>
                                            <th class="px-6 py-4 w-24 text-center">Cant.</th>
                                            <th class="px-6 py-4 w-32 text-right">Precio</th>
                                            <th class="px-6 py-4 w-32 text-right">Subtotal</th>
                                            <th class="px-6 py-4 w-20 text-center"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="articulos-tbody" class="divide-y divide-slate-100 dark:divide-slate-800">
                                        <tr class="empty-state">
                                            <td colspan="5" class="px-6 py-12 text-center text-slate-400">
                                                <span
                                                    class="material-symbols-outlined text-4xl mb-2">shopping_cart_off</span>
                                                <p>No hay artículos agregados</p>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Right Column: Totals & Actions -->
                        <div class="lg:col-span-1 space-y-6">
                            <div
                                class="bg-white dark:bg-surface-dark p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 sticky top-0">
                                <h3 class="text-lg font-bold mb-4">Resumen</h3>

                                <div class="space-y-4 mb-6">
                                    <div>
                                        <label for="tipo-pago" class="block text-sm font-bold mb-1">Método de
                                            Pago</label>
                                        <select id="tipo-pago"
                                            class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-4 py-2.5 outline-none focus:ring-2 focus:ring-primary">
                                            <option value="">Seleccione...</option>
                                        </select>
                                    </div>

                                    <div class="space-y-2 pt-4 border-t border-slate-100 dark:border-slate-800">
                                        <div class="flex justify-between text-sm">
                                            <span class="text-slate-500">Subtotal</span>
                                            <span id="subtotal-display" class="font-mono">₡0.00</span>
                                        </div>
                                        <div class="flex justify-between text-sm">
                                            <span class="text-slate-500">Descuento</span>
                                            <span id="descuento-display" class="font-mono text-primary">₡0.00</span>
                                        </div>
                                        <div class="flex justify-between text-sm">
                                            <span class="text-slate-500">Impuestos</span>
                                            <span id="impuestos-display" class="font-mono">₡0.00</span>
                                        </div>
                                        <div
                                            class="flex justify-between text-xl font-bold pt-2 text-slate-900 dark:text-white">
                                            <span>Total</span>
                                            <span id="total-display">₡0.00</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 gap-3">
                                    <button type="button"
                                        class="w-full py-3 px-4 rounded-xl bg-primary hover:bg-primary/90 text-slate-900 font-bold transition-colors shadow-lg shadow-primary/20 flex items-center justify-center gap-2"
                                        onclick="guardarFactura()">
                                        <span class="material-symbols-outlined">save</span>
                                        Guardar Factura
                                    </button>
                                    <button type="button"
                                        class="w-full py-3 px-4 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 font-bold transition-colors flex items-center justify-center gap-2"
                                        onclick="cancelarFactura()">
                                        <span class="material-symbols-outlined">cancel</span>
                                        Cancelar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/sidebar.js"></script>
    <script src="js/facturar.js"></script>
</body>

</html>
