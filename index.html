<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Restaurante - AdminPortal</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#0f172a",
                        "surface-dark": "#1e293b",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Manrope', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 antialiased font-display overflow-hidden">
    <div class="flex h-screen">
        <!-- Sidebar container - will be populated by sidebar.js -->
        <aside id="sidebar"
            class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col fixed inset-y-0 left-0 z-50 transition-transform duration-300">
            <!-- Content injected by JS -->
        </aside>

        <!-- Main Content Layout -->
        <div class="flex-1 ml-64 flex flex-col h-screen overflow-hidden bg-background-light dark:bg-background-dark">
            <!-- Header -->
            <header id="main-header"
                class="sticky top-0 z-40 flex h-16 items-center justify-between border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-background-dark/80 px-8 backdrop-blur-md">
                <!-- Header content injected by sidebar.js or static -->
                <div class="header-title flex items-center gap-4">
                    <h2 class="text-xl font-bold tracking-tight">Inicio</h2>
                </div>
                <div class="header-icons flex items-center gap-6">
                    <!-- User controls -->
                    <div class="relative flex items-center gap-3">
                        <!-- Injected by sidebar.js or placeholders -->
                        <div class="header-user-placeholder flex items-center gap-2">
                            <div class="size-8 rounded-full bg-slate-700 animate-pulse"></div>
                        </div>
                    </div>
                </div>
            </header>

            <main id="main-content" class="flex-1 overflow-auto p-8">
                <!-- Main dynamic content will go here -->
                <div class="max-w-[1400px] mx-auto">
                    <h1 class="text-3xl font-bold mb-6">Bienvenido al Sistema</h1>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- Example Dashboard Widgets -->
                        <div
                            class="bg-white dark:bg-surface-dark p-6 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
                            <h3 class="text-lg font-bold mb-2">Acceso Rápido</h3>
                            <p class="text-slate-400 text-sm">Selecciona una opción del menú para comenzar.</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Removed legacy scripts references in favor of updated structure -->
    <!-- Scripts updated to remove Lucide dependency -->
    <script src="js/sidebar.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
