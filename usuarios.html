<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Sistema Restaurante</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#0f172a",
                        "surface-dark": "#1e293b",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Manrope', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Custom Toggles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #13ec5b;
        }

        .toggle-checkbox:checked+.toggle-label {
            background-color: #13ec5b;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 antialiased font-display overflow-hidden">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside id="sidebar"
            class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col fixed inset-y-0 left-0 z-50 transition-transform duration-300">
        </aside>

        <!-- Main Content -->
        <div class="flex-1 ml-64 flex flex-col h-screen overflow-hidden bg-background-light dark:bg-background-dark">
            <!-- Header -->
            <header id="main-header"
                class="sticky top-0 z-40 flex h-16 items-center justify-between border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-background-dark/80 px-8 backdrop-blur-md">
                <div class="flex items-center gap-4">
                    <h2 class="text-xl font-bold tracking-tight">Seguridad</h2>
                </div>
                <!-- User Placeholder for sidebar.js -->
                <div class="header-user-placeholder flex items-center gap-2"></div>
            </header>

            <main class="flex-1 overflow-auto p-8">
                <div class="max-w-[1400px] mx-auto space-y-6">

                    <!-- Title and Add Button -->
                    <div class="flex flex-col sm:flex-row justify-between gap-4 items-center">
                        <div>
                            <h1 class="text-3xl font-bold">Gestión de Usuarios</h1>
                            <p class="text-slate-500 dark:text-slate-400 mt-1">Administre los accesos y roles del
                                sistema.</p>
                        </div>
                        <button id="btn-nuevo-usuario"
                            class="bg-primary hover:bg-primary/90 text-slate-900 font-bold py-2.5 px-5 rounded-xl flex items-center gap-2 transition-transform active:scale-95 shadow-lg shadow-primary/20">
                            <span class="material-symbols-outlined">person_add</span>
                            Nuevo Usuario
                        </button>
                    </div>

                    <!-- Filter -->
                    <div class="relative group">
                        <span
                            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors">search</span>
                        <input type="text" id="filtro-usuarios"
                            class="w-full bg-white dark:bg-surface-dark border border-slate-200 dark:border-slate-700 rounded-xl py-3 pl-12 pr-4 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none"
                            placeholder="Buscar usuario...">
                    </div>

                    <!-- Table -->
                    <div
                        class="bg-white dark:bg-surface-dark rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table id="tabla-usuarios" class="w-full text-left text-sm">
                                <thead
                                    class="bg-slate-50 dark:bg-slate-800/50 text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider text-xs">
                                    <tr>
                                        <th class="px-6 py-4">Usuario</th>
                                        <th class="px-6 py-4">Nombre Completo</th>
                                        <th class="px-6 py-4">Perfil</th>
                                        <th class="px-6 py-4">Estado</th>
                                        <th class="px-6 py-4 text-right">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="cuerpo-tabla-usuarios"
                                    class="divide-y divide-slate-100 dark:divide-slate-800">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal -->
    <div id="usuario-modal" class="modal hidden fixed inset-0 z-[100] overflow-y-auto" style="display: none;">
        <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm transition-opacity" aria-hidden="true"></div>
        <div class="flex min-h-full items-center justify-center p-4">
            <div
                class="relative transform w-full max-w-lg rounded-2xl bg-white dark:bg-surface-dark text-left shadow-2xl transition-all border border-slate-200 dark:border-slate-700">
                <div
                    class="flex items-center justify-between px-6 py-5 border-b border-slate-200 dark:border-slate-700">
                    <h3 class="text-xl font-bold text-slate-900 dark:text-white" id="modal-title">Nuevo Usuario</h3>
                    <button type="button"
                        class="close-button p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-400 hover:text-slate-500 transition-colors"
                        id="close-modal">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <div class="px-6 py-6">
                    <form id="form-usuario" class="space-y-6">
                        <input type="hidden" id="id_usuarios">

                        <div class="space-y-1.5">
                            <label for="usuario"
                                class="block text-sm font-bold text-slate-700 dark:text-slate-300">Usuario
                                (Login)</label>
                            <input type="text" id="usuario" name="usuario" required
                                class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all"
                                placeholder="ej. jdoe">
                        </div>

                        <div class="space-y-1.5">
                            <label for="nombre_completo"
                                class="block text-sm font-bold text-slate-700 dark:text-slate-300">Nombre
                                Completo</label>
                            <input type="text" id="nombre_completo" name="nombre_completo" required
                                class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all"
                                placeholder="Juan Pérez">
                        </div>

                        <div class="space-y-1.5">
                            <label for="perfil"
                                class="block text-sm font-bold text-slate-700 dark:text-slate-300">Perfil (Rol)</label>
                            <select id="perfil" name="perfil" required
                                class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all">
                                <option value="">Seleccione...</option>
                                <option value="administrador">Administrador</option>
                                <option value="cajero">Cajero</option>
                                <option value="mesero">Mesero</option>
                                <option value="cocina">Cocina</option>
                            </select>
                        </div>

                        <div class="space-y-1.5">
                            <label for="password"
                                class="block text-sm font-bold text-slate-700 dark:text-slate-300">Contraseña</label>
                            <input type="password" id="password" name="password"
                                class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all"
                                placeholder="••••••••">
                            <p class="text-xs text-slate-500 mt-1" id="password-help">Requerido para nuevos usuarios.
                            </p>
                        </div>

                        <div class="flex items-center gap-3">
                            <input type="checkbox" id="esta_activo" name="esta_activo" value="1" checked
                                class="w-5 h-5 text-primary bg-slate-100 border-gray-300 rounded focus:ring-primary dark:focus:ring-primary dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600">
                            <label for="esta_activo"
                                class="text-sm font-bold text-slate-700 dark:text-slate-300">Usuario Activo</label>
                        </div>

                        <div class="flex justify-end gap-3 pt-4">
                            <button type="button" id="btn-cancelar"
                                class="px-5 py-2.5 rounded-lg text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 font-bold transition-colors">Cancelar</button>
                            <button type="submit" id="btn-guardar"
                                class="px-5 py-2.5 rounded-lg bg-primary hover:bg-primary/90 text-slate-900 font-bold transition-colors shadow-lg shadow-primary/20">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/sidebar.js"></script>
    <script src="js/usuarios.js"></script>
</body>

</html>
