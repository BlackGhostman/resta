<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Sistema Restaurante</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom modal width for users */
        .modal-content.medium {
            width: 50%;
            max-width: 600px;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 9999px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .status-active {
            background-color: #d1fae5;
            color: #065f46;
        }

        /* green-100 green-800 */
        .status-inactive {
            background-color: #fee2e2;
            color: #991b1b;
        }

        /* red-100 red-800 */
    </style>
</head>

<body>
    <div id="app-container">
        <!-- Header will be same as other pages -->
        <header id="main-header">
            <i data-lucide="shield"></i>
            <div class="header-title"><span>PIKA BAR - Seguridad</span></div>
            <div class="header-icons"><i data-lucide="user"></i><i data-lucide="more-vertical"></i></div>
        </header>

        <div id="main-layout">
            <aside id="sidebar">
                <div class="sidebar-header">
                    <h1>MENÚ</h1>
                </div>
                <!-- Dynamic Nav will be rendered here -->
                <nav class="sidebar-nav"></nav>
            </aside>

            <main id="main-content">
                <div class="container">
                    <div class="header-with-button">
                        <h1>Gestión de Usuarios</h1>
                        <button id="btn-nuevo-usuario" class="btn-primary">
                            <i data-lucide="user-plus" class="w-4 h-4 mr-2"></i>Nuevo Usuario
                        </button>
                    </div>

                    <!-- Modal Usuario -->
                    <div id="usuario-modal" class="modal">
                        <div class="modal-content medium">
                            <div class="modal-header">
                                <h2 id="modal-title">Nuevo Usuario</h2>
                                <span class="close-button" id="close-modal">&times;</span>
                            </div>
                            <div class="modal-body">
                                <form id="form-usuario">
                                    <input type="hidden" id="id_usuarios">

                                    <div class="form-grid">
                                        <div class="form-group">
                                            <label for="usuario">Usuario (Login)</label>
                                            <input type="text" id="usuario" name="usuario" required class="form-control"
                                                placeholder="ej. jdoe">
                                        </div>

                                        <div class="form-group">
                                            <label for="nombre_completo">Nombre Completo</label>
                                            <input type="text" id="nombre_completo" name="nombre_completo" required
                                                class="form-control" placeholder="Juan Pérez">
                                        </div>

                                        <div class="form-group">
                                            <label for="perfil">Perfil (Rol)</label>
                                            <select id="perfil" name="perfil" required class="form-control">
                                                <option value="">Seleccione...</option>
                                                <option value="administrador">Administrador</option>
                                                <option value="cajero">Cajero</option>
                                                <option value="mesero">Mesero</option>
                                                <option value="cocina">Cocina</option>
                                            </select>
                                        </div>

                                        <div class="form-group">
                                            <label for="password">Contraseña</label>
                                            <input type="password" id="password" name="password" class="form-control"
                                                placeholder="••••••••">
                                            <small class="text-gray-500" id="password-help">Requerido para nuevos
                                                usuarios.</small>
                                        </div>

                                        <div class="form-group toggle-container">
                                            <label for="esta_activo">Usuario Activo</label>
                                            <label class="toggle-switch">
                                                <input type="checkbox" id="esta_activo" name="esta_activo" value="1"
                                                    checked>
                                                <span class="slider"></span>
                                            </label>
                                        </div>
                                    </div>

                                    <div class="button-container mt-6">
                                        <button type="submit" id="btn-guardar" class="btn-primary">Guardar</button>
                                        <button type="button" id="btn-cancelar" class="btn-secondary">Cancelar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Tabla Usuarios -->
                    <div class="table-container mt-4">
                        <input type="text" id="filtro-usuarios" class="filter-input mb-4 w-full p-2 border rounded"
                            placeholder="Buscar usuario...">

                        <table id="tabla-usuarios" class="min-w-full">
                            <thead>
                                <tr>
                                    <th>Usuario</th>
                                    <th>Nombre Completo</th>
                                    <th>Perfil</th>
                                    <th>Estado</th>
                                    <th class="acciones">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="cuerpo-tabla-usuarios">
                                <!-- JS will populate this -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/sidebar.js"></script>
    <script src="js/usuarios.js"></script>
</body>

</html>
