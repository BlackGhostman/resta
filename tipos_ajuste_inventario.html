<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento de Tipos de Ajuste</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide-react@0.390.0/dist/lucide-react.js"></script>
</head>
<body>
    <div id="app-container">
        <header id="main-header">
            <i data-lucide="home"></i>
            <div class="header-title"><span>sistema.com</span></div>
            <div class="header-icons"><i data-lucide="user"></i><i data-lucide="more-vertical"></i></div>
        </header>

        <div id="main-layout">
            <aside id="sidebar">
                <div class="sidebar-header"><h1>MENÚ</h1></div>
                <nav class="sidebar-nav">
                    <div class="active-user"><i data-lucide="user" class="text-yellow"></i><span class="text-yellow">Camilo B</span></div>
                    <div class="nav-buttons">
                        <a href="mesas.html" class="nav-button"><i data-lucide="layout-grid"></i><span>Mesas</span></a>
                        <a href="editor.html" class="nav-button"><i data-lucide="edit"></i><span>Editor de Mesas</span></a>
                        <hr>
                        <a href="articulos.html" class="nav-button"><i data-lucide="package"></i><span>Artículos</span></a>
                        <a href="proveedores.html" class="nav-button"><i data-lucide="truck"></i><span>Proveedores</span></a>
                        <a href="familias.html" class="nav-button"><i data-lucide="folder-tree"></i><span>Familias</span></a>
                        <a href="subfamilias.html" class="nav-button"><i data-lucide="folder"></i><span>Subfamilias</span></a>
                        <a href="medidas.html" class="nav-button"><i data-lucide="ruler"></i><span>Medidas</span></a>
                        <a href="gestionar_ubicaciones.html" class="nav-button"><i data-lucide="map-pin"></i><span>Ubicaciones Inv.</span></a>
                        <hr>
                        <a href="ajustes_inventario.html" class="nav-button"><i data-lucide="move"></i><span>Ajustes Inventario</span></a>
                        <a href="tipos_ajuste_inventario.html" class="nav-button"><i data-lucide="settings-2"></i><span>Tipos de Ajuste</span></a>
                        <a href="tipos_cuenta.html" class="nav-button"><i data-lucide="arrow-right-left"></i><span>Tipos de Cuenta</span></a>
                    </div>
                </nav>
            </aside>

            <main id="main-content">
                <div class="container">
                    <div class="header-with-button">
                        <h1>Mantenimiento de Tipos de Ajuste</h1>
                        <button id="btn-abrir-modal" class="btn-primary">Agregar Tipo</button>
                    </div>

                    <!-- The Modal -->
                    <div id="tipo-ajuste-modal" class="modal">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h2 id="modal-title">Agregar Tipo de Ajuste</h2>
                                <span class="close-button">&times;</span>
                            </div>
                            <div class="modal-body">
                                <form id="form-tipo-ajuste">
                                    <input type="hidden" id="id_tipos_ajuste">
                                    <div class="form-grid">
                                        <div class="form-group">
                                            <label for="nombre">Nombre</label>
                                            <input type="text" id="nombre" name="nombre" required>
                                        </div>
                                        <div class="form-group">
                                            <label for="tipo_cuenta">Tipo de Cuenta</label>
                                            <select id="tipo_cuenta" name="tipo_cuenta" required>
                                                <option value="">Seleccione una opción</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="button-container">
                                        <button type="submit" id="btn-guardar">Guardar</button>
                                        <button type="button" id="btn-limpiar">Limpiar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
            
                    <input type="text" id="filtro-tipos-ajuste" class="filter-input" placeholder="Buscar por nombre o tipo...">
                    <table id="tabla-tipos-ajuste">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Tipo de Cuenta</th>
                                <th class="acciones">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpo-tabla-tipos-ajuste"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/main.js"></script>
    <script src="js/tipos_ajuste_inventario.js"></script>
</body>
</html>
