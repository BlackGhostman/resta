<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento de Subfamilias</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide-react@0.390.0/dist/lucide-react.js"></script>
</head>

<body>
    <div id="app-container">
        <header id="main-header">
            <i data-lucide="home"></i>
            <div class="header-title">
                <span>sistema.com</span>
            </div>
            <div class="header-icons">
                <i data-lucide="user"></i>
                <i data-lucide="more-vertical"></i>
            </div>
        </header>

        <div id="main-layout">
            <aside id="sidebar">
                <div class="sidebar-header">
                    <h1>MENÚ</h1>
                </div>
                <nav class="sidebar-nav">
                    <div class="active-user"><i data-lucide="user" class="text-yellow"></i><span
                            class="text-yellow">Camilo B</span></div>
                </nav>
            </aside>

            <main id="main-content">
                <div class="container">
                    <div class="header-with-button">
                        <h1>Mantenimiento de Subfamilias</h1>
                        <button id="btn-abrir-modal" class="btn-primary">Agregar Subfamilia</button>
                    </div>

                    <!-- The Modal -->
                    <div id="subfamilia-modal" class="modal">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h2 id="modal-title">Agregar Subfamilia</h2>
                                <span class="close-button">&times;</span>
                            </div>
                            <div class="modal-body">
                                <form id="form-subfamilia">
                                    <input type="hidden" id="id_subfamilias">
                                    <div class="form-grid">
                                        <div class="form-group">
                                            <label for="id_familia">Familia</label>
                                            <select id="id_familia" name="id_familia" required>
                                                <!-- Opciones de familias se cargarán aquí -->
                                            </select>
                                        </div>
                                        <div class="form-group">
                                            <label for="descripcion">Descripción</label>
                                            <input type="text" id="descripcion" name="descripcion" required>
                                        </div>
                                    </div>
                                    <div class="button-container">
                                        <button type="submit" id="btn-guardar">Guardar</button>
                                        <button type="button" id="btn-limpiar">Limpiar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <h2>Listado de Subfamilias</h2>
                    <input type="text" id="filtro-subfamilias" class="filter-input"
                        placeholder="Buscar por descripción o familia...">
                    <table id="tabla-subfamilias">
                        <thead>
                            <tr>
                                <th>Descripción</th>
                                <th>Familia</th>
                                <th class="acciones">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpo-tabla-subfamilias">
                            <!-- Filas de subfamilias se insertarán aquí -->
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/main.js"></script>
    <script src="js/subfamilias.js"></script>
</body>

</html>
